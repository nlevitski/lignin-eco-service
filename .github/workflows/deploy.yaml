name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lignineco-service-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_PATH VPS_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing $name secret" >&2
              exit 1
            fi
          done

          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy files and deploy
        run: |
          set -euo pipefail

          remote_home="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'printf %s "$HOME"')"
          case "$VPS_PATH" in
            '~/'*) app_dir="$remote_home/${VPS_PATH#\~/}" ;;
            /*) app_dir="$VPS_PATH" ;;
            *) echo 'VPS_PATH must start with ~/ or /' >&2; exit 1 ;;
          esac

          if [[ ! "$app_dir" =~ ^/[a-zA-Z0-9._/-]+$ ]] || \
             [[ "$app_dir" != */lignineco/service ]]; then
            echo 'VPS_PATH must resolve to an absolute .../lignineco/service path' >&2
            exit 1
          fi

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$app_dir/.tmp' '$app_dir/public/uploads'"

          rsync --archive --compress --delete \
            --exclude='/.git/' \
            --exclude='/.env*' \
            --exclude='/.tmp/' \
            --exclude='/public/uploads/' \
            --exclude='/node_modules/' \
            --exclude='/dist/' \
            --exclude='/build/' \
            --exclude='/.strapi/' \
            --exclude='/backups/' \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            ./ "$VPS_USER@$VPS_HOST:$app_dir/"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "APP_DIR='$app_dir' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -s .env || { echo 'Missing .env on VPS' >&2; exit 1; }
          docker network inspect lignin >/dev/null
          docker compose config --quiet
          docker compose up -d --build

          container_id="$(docker compose ps -q lignineco-strapi)"
          test -n "$container_id"
          show_diagnostics() {
            docker compose ps || true
            docker compose logs --no-color --tail=100 lignineco-strapi || true
            docker inspect --format '{{range .State.Health.Log}}{{println .Output}}{{end}}' "$container_id" || true
            ls -ldn .tmp .tmp/data.db public/uploads 2>/dev/null || true
          }
          for attempt in $(seq 1 36); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            case "$health" in
              healthy) docker compose ps; exit 0 ;;
              unhealthy) echo 'Strapi container is unhealthy' >&2; show_diagnostics; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Strapi did not become healthy in time' >&2
          show_diagnostics
          exit 1
          REMOTE
